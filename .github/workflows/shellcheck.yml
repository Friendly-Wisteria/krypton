name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ubuntu-latest には shellcheck がプリインストールされている
      - name: Show ShellCheck version
        run: shellcheck --version

      - name: Run ShellCheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
